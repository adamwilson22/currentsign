name: Trigger cPanel Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            export PHP_INI_SCAN_DIR=/home/curropui/.php-cli
            cd /home/curropui/currentsign
            git pull origin main
            export DEPLOYPATH=/home/curropui/public_html/
            cp -R * $DEPLOYPATH
            cd $DEPLOYPATH
            /opt/alt/php84/usr/bin/composer install --no-dev --optimize-autoloader
            /opt/alt/php84/usr/bin/php artisan migrate --force
            if [ ! -f storage/oauth-private.key ] || [ ! -f storage/oauth-public.key ]; then
              /opt/alt/php84/usr/bin/php artisan passport:keys --force
            fi
            # Ensure Stripe keys exist in production .env when provided as Actions secrets.
            ENV_FILE=/home/curropui/public_html/.env
            if [ -f "$ENV_FILE" ]; then
              upsert_env() {
                KEY="$1"; VAL="$2"
                [ -z "$VAL" ] && return 0
                if grep -q "^${KEY}=" "$ENV_FILE"; then
                  sed -i "s|^${KEY}=.*|${KEY}=${VAL}|" "$ENV_FILE"
                else
                  printf "\n%s=%s\n" "$KEY" "$VAL" >> "$ENV_FILE"
                fi
              }
              upsert_env STRIPE_SECRET_KEY "${{ secrets.STRIPE_SECRET_KEY }}"
              upsert_env STRIPE_PUBLISHABLE_KEY "${{ secrets.STRIPE_PUBLISHABLE_KEY }}"
              upsert_env STRIPE_CURRENCY "${{ secrets.STRIPE_CURRENCY }}"
            fi
            /opt/alt/php84/usr/bin/php artisan config:cache
            /opt/alt/php84/usr/bin/php artisan route:cache
            /opt/alt/php84/usr/bin/php artisan view:cache
