name: Staging CI/CD Deploy

on:
  push:
    branches:
      - staging

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4

      - name: Install Dependencies
        run: composer install --no-dev --optimize-autoloader

      # 🔍 SSH connectivity test
      - name: Check SSH Connectivity
        run: nc -vz ${{ secrets.SSH_HOST }} 21098 || echo "SSH not reachable"

      - name: Deploy via SSH Password
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: 21098
          script: |
            set -e

            export PATH="$HOME/bin:/usr/local/bin:/opt/cpanel/composer/bin:$PATH"

            echo "📂 Entering project directory..."
            cd /home/tqxferau/currentsign.the4loop.com

            echo "🔄 Updating code..."
            git fetch origin
            git reset --hard origin/staging

            # Resolve PHP binary (cPanel often needs a versioned path)
            if command -v php >/dev/null 2>&1; then
              PHP_BIN="$(command -v php)"
            elif [ -x /usr/local/bin/php ]; then
              PHP_BIN=/usr/local/bin/php
            else
              PHP_BIN="$(ls /usr/local/bin/php 2>/dev/null | head -n 1)"
            fi

            if [ -z "$PHP_BIN" ]; then
              echo "❌ PHP binary not found on server"
              exit 1
            fi
            echo "Using PHP: $PHP_BIN ($("$PHP_BIN" -v | head -n 1))"

            # Resolve Composer (shared hosts often omit it from PATH)
            run_composer() {
              if command -v composer >/dev/null 2>&1; then
                composer "$@"
              elif [ -x /opt/cpanel/composer/bin/composer ]; then
                /opt/cpanel/composer/bin/composer "$@"
              elif [ -x /usr/local/bin/composer ]; then
                /usr/local/bin/composer "$@"
              elif [ -f "$HOME/bin/composer" ]; then
                "$PHP_BIN" "$HOME/bin/composer" "$@"
              elif [ -f composer.phar ]; then
                "$PHP_BIN" composer.phar "$@"
              else
                echo "⬇️ Composer not found — downloading composer.phar..."
                "$PHP_BIN" -r "copy('https://getcomposer.org/installer', 'composer-setup.php');"
                "$PHP_BIN" composer-setup.php --install-dir="$(pwd)" --filename=composer.phar --quiet
                rm -f composer-setup.php
                "$PHP_BIN" composer.phar "$@"
              fi
            }

            echo "📦 Installing dependencies..."
            run_composer install --no-dev --optimize-autoloader --no-interaction

            echo "🧹 Clearing Laravel cache..."
            "$PHP_BIN" artisan optimize:clear

            echo "🗄️ Running migrations..."
            "$PHP_BIN" artisan migrate --force

            echo "✅ Deployment completed"
